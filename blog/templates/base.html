<!-- templates/index.html -->
{% load static %}
<html>
  <head>
    <title>Maylov blog</title>
    <link href="{% static 'css/base.css' %}" rel="stylesheet">
    <meta name="csrf-token" content="{{ csrf_token }}">
  </head>
  <body>
    <header>
      <div class="header">
        <div class="header_top">
          <div class="header_top_left">
            <a href="{% url 'index' %}" class="header_top_left__title">Maylov blog</a>
            <p class="header_left__slogan">Занимайтесь тем, что нравится!</p>
          </div>
          <div class="header_top_right">
            <a href="https://maylov.ru" class="header_top_right__menu">Home</a>
          </div>
        </div>
        <div class="header__content">
          <div class="header__content__subscription">
            <p class="header__content__subscription__p">Подпишись на уведомления о новых публикациях на электронную почту</p>
            <button class="header__content__subscription__button" id="subscribeBtn">Подписаться</button>
            <div id="subscribeModal" style="display:none;">
            <form id="subscribeForm" method="post" action="/app/subscribe/" class="subscribe-box" style="display:none;">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Введите Email" required>
        <button type="submit" class="header__content__subscription__button" id="subscribeBtn">OK</button>
    </form>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

const csrftoken = getCookie('csrftoken');

document.getElementById('subscribeBtn').addEventListener('click', () => {
    document.getElementById('subscribeModal').style.display = 'block';
});

document.getElementById('subscribeForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    let formData = new FormData(e.target);

    let response = await fetch("{% url 'subscribe' %}", {
        method: "POST",
        body: formData,
        headers: {
            "X-CSRFToken": csrftoken
        }
    });

    let text = await response.text();
    let data;

    try {
        data = JSON.parse(text);
    } catch {
        console.error("Server returned HTML instead of JSON:", text);
        alert("Ошибка CSRF — перезагрузите страницу (CTRL+F5)");
        return;
    }

    if (data.message) {
        alert(data.message);
        e.target.reset();
    } else if (data.errors) {
        alert("Ошибка: " + JSON.stringify(data.errors));
    }
});
</script>
<script>
document.getElementById("subscribeForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const form = e.target;
    const formData = new FormData(form);

    const response = await fetch(form.action, {
        method: "POST",
        body: formData,
        headers: {
            "X-Requested-With": "XMLHttpRequest"
        }
    });

    const msg = document.getElementById("subscribe-message");

    if (response.ok) {
        msg.style.color = "green";
        msg.textContent = "✅ Вы подписаны!";
        form.reset();
    } else {
        msg.style.color = "red";
        msg.textContent = "⚠ Email уже подписан или ошибка сервера";
    }
});
</script>
<script>document.getElementById("subscribeBtn").addEventListener("click", function () {
    this.style.display = "none";               // скрываем кнопку
    document.getElementById("subscribeForm").style.display = "flex"; // показываем поле ввода
    document.getElementById("emailInput").focus(); // сразу ставим фокус
});

document.getElementById("subscribeForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    
    const email = document.getElementById("emailInput").value;

    const response = await fetch("/subscribe/", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
        body: JSON.stringify({ email })
    });

    const result = await response.json();
    document.getElementById("subscribe-message").innerText = result.message;

    // optionally убрать поле и вернуть кнопку (если хочешь)
    // document.getElementById("subscribeForm").style.display = "none";
    // document.getElementById("subscribeBtn").style.display = "inline-block";
});
</script>



          </div>
        </div>
      </div>
	</header>
    <main class="main">
    <div class="main__posts">
      <div class="main__posts__post">
      {% block content %}
      {% endblock content %}
      </div>
    </div>
    </main>
    <footer>
    <div>
            <p><strong>© 2025 smilevpn.</strong> Все права защищены</p>
    </div>
	</footer>
  </body>
</html>
